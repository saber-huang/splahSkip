name: Build

# 每次推送代码、发起合并请求，或者手动点 "Run workflow" 时，自动编译并跑一遍测试
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # 单元测试 + 调试版 + 发布版（未签名）。发布版会额外跑一遍"必须修复"级别的代码检查
      - name: Test and build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: SplashSkip-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
